<div class="container">
  <h1>Gestión de Personas</h1>

  <div class="form-container">
    <h2>{{ editingCedula ? 'Editar Persona' : 'Agregar Nueva Persona' }}</h2>
    <form [formGroup]="personaForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="cedula">Cédula:</label>
        <input id="cedula" formControlName="cedula" placeholder="Cédula">
      </div>
      <div class="form-group">
        <label for="nombre">Nombre:</label>
        <input id="nombre" formControlName="nombre" placeholder="Nombre completo">
      </div>
      <div class="form-group">
        <label for="direccion">Dirección:</label>
        <input id="direccion" formControlName="direccion" placeholder="Dirección">
      </div>
      <div class="form-actions">
        <button type="submit" [disabled]="personaForm.invalid">{{ editingCedula ? 'Actualizar' : 'Crear' }}</button>
        <button type="button" (click)="resetForm()">Cancelar</button>
      </div>
    </form>
  </div>

  <div class="table-container">
    <h2>Listado de Personas</h2>
    <table>
      <thead>
        <tr>
          <th>Cédula</th>
          <th>Nombre</th>
          <th>Dirección</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let persona of personas">
          <td>{{ persona.cedula }}</td>
          <td>{{ persona.nombre }}</td>
          <td>{{ persona.direccion }}</td>
          <td class="actions">
            <button (click)="editPersona(persona)">Editar</button>
            <button (click)="deletePersona(persona.cedula)">Eliminar</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
<router-outlet></router-outlet>
